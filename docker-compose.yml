services:
  n8n:
    image: n8nio/n8n:1.86.0
    container_name: insta_automation
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_TRUST_PROXY_HEADER=true
      - N8N_SECURITY_CONTENTS_CSRF=true
      - N8N_RUNNERS_ENABLED=true

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    container_name: mock_api_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uvicorn", "mock_api_server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
    environment:
      - PRIMARY_MODEL=${PRIMARY_MODEL:-ollama/llama3.2}
      - FALLBACK_MODELS=${FALLBACK_MODELS:-gpt-4o}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
